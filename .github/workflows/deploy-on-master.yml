name: Deploy to Vercel on master merge

on:
  push:
    branches:
      - master  # or 'master', depending on your branch name

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel Deploy Hook
        run: curl -X POST https://api.vercel.com/v1/integrations/deploy/prj_jHb6PpwNHrIzJO88ZHg4VuirJkeF/Ywazz1RZY9
        
